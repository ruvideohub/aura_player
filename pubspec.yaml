name: aura_player
description: AURA Player — красивый аудио и видео плеер на Flutter + Kotlin.
publish_to: "none"
version: 2.0.0+40

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Состояние
  flutter_riverpod: ^2.5.1

  # Движок воспроизведения
  # Desktop: libmpv (MKV/HEVC/субтитры), Android: Media3 (см. android_player_backend.dart)
  media_kit: ">=1.1.10 <2.0.0"
  media_kit_video: ">=1.2.4 <2.0.0"
  media_kit_libs_windows_video: ">=1.0.9 <2.0.0"

  # Android видео — нативный Media3 (video_player_android → ExoPlayer/Media3)
  video_player: ^2.9.2


  # Оконный режим и кастомный тайтлбар (Windows/Linux/macOS)
  window_manager: ^0.4.3

  # Drag & drop файлов в окно
  desktop_drop: ^0.5.0

  # Диалоги выбора файлов и папок
  file_selector: ^1.0.3

  # Разрешения Android
  permission_handler: ^11.3.1

  # Настройки и локальное хранилище
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Ссылки в настройках
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true